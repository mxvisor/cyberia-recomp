# The game directory for SR-SDK/tools/portable_cd.py (make portable-data), and
# the disc for disc_tree.py. Paths are relative to the repository's root.
#
# INSTCYB.EXE (INSTALL.BAT, SETUP.BAT) has one kind of install: it copies
# CYB.EXE, DOS4GW.EXE, CYBERIA.BAT, AMBIANCE.Z94, JOY.DEF, SAVES.Z94,
# LOAD.BIN, MENUVOC.BIN, ZAK.G93, README.TXT and README.BAT to C:\CYBERIA; the
# game reads everything else from the disc (D:GLOBALS.DEF, ...), so the rest of
# the disc is in the directory as well, which is also the disc (GLOBALS.DEF,
# GAME_CD_MARKER).

# the disc image, the one path outside the repository (its cue sheet is made in build/cd/)
image=../iso/CYBERIA_RUS.iso

# the installer (SETUP.Z94: its screens)
skip_files=INSTALL.BAT SETUP.BAT INSTCYB.EXE SETUP.Z94

# music: the audio tracks of the disc
audio_dir=AUDIO
audio_cue=CYBERIA_RUS.cue
audio=ogg
