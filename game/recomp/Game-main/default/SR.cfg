# SR's configuration for the original. Empty = the built-in defaults;
# keys are added after the first run of SR, when something needs them.

# The same as Mass Destruction's (game/recomp/Mass-Destruction-main/default/SR.cfg):
# the program is a DOS/4GW one, and the extender keeps its stack and its work
# tables dword-aligned.
esp_dword_aligned=yes
ebp_dword_aligned=yes
# DOS/4GW's flat DS lets the game store into its code object: the code
# sections must not be "constant" (in the output of SR: "datasegment cseg01
# constant" without this key).
code_writable=yes
