# The description of the game for SR-SDK/scons/game.py (keys: SR-SDK/README.md).

platform=dos
sdk_version=0.1
archs=llasm
modules=Game-main
variants=default
input_exe=disc:CYB.EXE
link=separate
devices=pc64-linux,pc64-windows,arm64-linux,arm64-android
program=cyberia

# Android (SR-SDK/tools/android_apk.py): id of the application and its name
# in the launcher.
android_id=io.github.mxvisor.cyberia
android_name=Cyberia

# The game brings its own timer: the default SR_CheckTimer of the runtime
# (runtime/dos/Game_dostimer.c) does not know about the sound card, whose IRQ
# the game waits for (game/Game_dostimer.c).
runtime_skip=Game_dostimer.c
