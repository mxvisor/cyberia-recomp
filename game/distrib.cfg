# The game directory for SR-SDK/tools/distrib_cd.py (make distrib-data), and
# the disc for disc_tree.py. Paths are relative to the repository's root.
#
# INSTCYB.EXE (INSTALL.BAT, SETUP.BAT) has one kind of install: it copies
# CYB.EXE, DOS4GW.EXE, CYBERIA.BAT, AMBIANCE.Z94, JOY.DEF, SAVES.Z94,
# LOAD.BIN, MENUVOC.BIN, ZAK.G93, README.TXT and README.BAT to C:\CYBERIA; the
# game reads everything else from the disc (D:GLOBALS.DEF, ...), so the rest of
# the disc is in the directory as well, which is also the disc (GLOBALS.DEF,
# GAME_CD_MARKER).

# the disc image, the one path outside the repository (its cue sheet is made in build/cd/).
# The Russian release; the English one builds the same way, from its own image
# (make ... image=../iso/Cyberia.bin): game/recomp/Game-main/default/sha256 lists
# the CYB.EXE of both.
image=../iso/CYBERIA_RUS.iso

# the installer (SETUP.Z94: its screens); the English disc also carries demos of
# other games of the publisher (INST_*.BAT install them), which are not Cyberia's
skip_files=INSTALL.BAT SETUP.BAT INSTCYB.EXE SETUP.Z94 INST_*.BAT DEMOS.TXT
skip_dirs=ALONE BTHORNE MARIO OOTWDEMO SR_DEMO STARTREK VIKINGS

# music: the audio tracks of the disc
audio_dir=AUDIO
audio_cue=CYBERIA_RUS.cue
audio=ogg

# JOY.DEF is the joystick's calibration, read at the start (X min, max, Y min, max, X and Y
# at the centre; 16-bit words) and written back at a quit when the game found a joystick;
# the game positions the crosshair by it, it does not calibrate by itself. The disc's
# (34-753, 35-660, centre 450/358) is a machine's of 1994: on the port's game port
# (SR-SDK runtime/dos/Game_dosjoy.c, 16-2015 reads, centre 1015) the stick would stay at
# the bottom right until calibrated from the menu. This one is the port's, with the
# game's own margins of 20 at the ends.
extra_files=game/install/JOY.DEF
